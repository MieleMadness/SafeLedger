name: Build SafeLedger Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm run test:regression

      - name: Run Electron crypto smoke test
        run: npm run test:electron-crypto

      - name: Configure Electron sandbox helper for GUI smoke
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Launch real SafeLedger GUI smoke test
        run: xvfb-run -a npm run test:gui-smoke

      - name: Build AppImage
        run: npm run dist:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
