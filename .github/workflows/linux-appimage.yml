name: Build SafeLedger Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm run test:regression

      - name: Run Phase 5 contract gate
        run: node scripts/hotfix-2.6.53-tests.js

      - name: Run encrypted lifecycle behavioral test
        run: node scripts/behavioral-lifecycle-tests.js

      - name: Test release trust metadata generator
        run: node scripts/release-trust-tests.js

      - name: Run Electron crypto smoke test
        run: npm run test:electron-crypto

      - name: Configure Electron sandbox helper for GUI smoke
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Launch real SafeLedger GUI smoke test
        run: xvfb-run -a npm run test:gui-smoke

      - name: Build AppImage
        run: npm run dist:linux

      - name: Stage clean download and verification files
        id: stage
        run: |
          mkdir -p release/linux/app release/linux/verification
          ARTIFACT=$(find dist -maxdepth 1 -type f -name 'SafeLedger-*-x86_64.AppImage' | head -n 1)
          test -n "$ARTIFACT"
          STAGED="release/linux/app/$(basename "$ARTIFACT")"
          cp "$ARTIFACT" "$STAGED"
          node scripts/generate-release-trust.js "$STAGED" release/linux/verification linux x64 "${{ github.sha }}"
          SBOM=$(find release/linux/verification -maxdepth 1 -type f -name '*-SBOM.cdx.json' | head -n 1)
          test -n "$SBOM"
          echo "artifact=$STAGED" >> "$GITHUB_OUTPUT"
          echo "sbom=$SBOM" >> "$GITHUB_OUTPUT"

      - name: Attest Linux build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}

      - name: Attest Linux SBOM
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}
          sbom-path: ${{ steps.stage.outputs.sbom }}

      - name: Upload clean AppImage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Linux-AppImage
          path: release/linux/app/*
          if-no-files-found: error

      - name: Upload Linux verification files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Linux-Verification
          path: release/linux/verification/*
          if-no-files-found: error
