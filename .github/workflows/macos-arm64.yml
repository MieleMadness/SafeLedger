name: Build SafeLedger macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - safeledger-2.6.1-development
      - safeledger-2.6.2-development
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Confirm native Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.arch')" = "arm64"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm run test:regression

      - name: Run Phase 5 contract gate
        run: node scripts/hotfix-2.6.53-tests.js

      - name: Run encrypted lifecycle behavioral test
        run: node scripts/behavioral-lifecycle-tests.js

      - name: Test release trust metadata generator
        run: node scripts/release-trust-tests.js

      - name: Run Electron crypto smoke test
        run: npm run test:electron-crypto

      - name: Launch real SafeLedger GUI smoke test
        run: npm run test:gui-smoke

      - name: Build unsigned Apple Silicon ZIP
        run: npm run dist:mac:arm64

      - name: Verify packaged architecture
        run: |
          APP_BINARY="dist/mac-arm64/SafeLedger.app/Contents/MacOS/SafeLedger"
          test -f "$APP_BINARY"
          test "$(lipo -archs "$APP_BINARY")" = "arm64"
          ZIP_COUNT=$(find dist -maxdepth 1 -type f -name 'SafeLedger-*-macOS-arm64.zip' | wc -l | tr -d ' ')
          test "$ZIP_COUNT" = "1"

      - name: Stage clean download and verification files
        id: stage
        run: |
          mkdir -p release/macos/app release/macos/verification
          ARTIFACT=$(find dist -maxdepth 1 -type f -name 'SafeLedger-*-macOS-arm64.zip' | head -n 1)
          test -n "$ARTIFACT"
          STAGED="release/macos/app/$(basename "$ARTIFACT")"
          cp "$ARTIFACT" "$STAGED"
          node scripts/generate-release-trust.js "$STAGED" release/macos/verification macos arm64 "${{ github.sha }}"
          SBOM=$(find release/macos/verification -maxdepth 1 -type f -name '*-SBOM.cdx.json' | head -n 1)
          test -n "$SBOM"
          echo "artifact=$STAGED" >> "$GITHUB_OUTPUT"
          echo "sbom=$SBOM" >> "$GITHUB_OUTPUT"

      - name: Attest macOS build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}

      - name: Attest macOS SBOM
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}
          sbom-path: ${{ steps.stage.outputs.sbom }}

      - name: Upload clean Apple Silicon test build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-macOS-arm64
          path: release/macos/app/*
          if-no-files-found: error

      - name: Upload macOS verification files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-macOS-arm64-Verification
          path: release/macos/verification/*
          if-no-files-found: error
