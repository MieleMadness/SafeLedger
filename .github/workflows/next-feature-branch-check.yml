name: Next Feature Branch Check

on:
  push:
    branches:
      - safeledger-next-profile-setup-dashboard-links

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check modified JavaScript syntax
        run: |
          node --check src/main/profile-setup.js
          node --check src/main/profile.js
          node --check src/main/dashboard-ui.js
          node --check src/main/main.js
          node --check scripts/next-profile-setup-dashboard-tests.js

      - name: Test profile setup and dashboard actions
        run: node scripts/next-profile-setup-dashboard-tests.js

      - name: Build renderer bundle
        run: npm run prepare:renderer
