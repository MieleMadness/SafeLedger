name: Build SafeLedger Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        shell: pwsh
        run: npm run test:regression

      - name: Run Phase 5 contract gate
        shell: pwsh
        run: node scripts/hotfix-2.6.53-tests.js

      - name: Run encrypted lifecycle behavioral test
        shell: pwsh
        run: node scripts/behavioral-lifecycle-tests.js

      - name: Test release trust metadata generator
        shell: pwsh
        run: node scripts/release-trust-tests.js

      - name: Run Electron crypto smoke test
        shell: pwsh
        run: npm run test:electron-crypto

      - name: Launch real SafeLedger GUI smoke test
        shell: pwsh
        run: npm run test:gui-smoke

      - name: Build portable EXE
        shell: pwsh
        run: npm run dist:win

      - name: Stage clean download and verification files
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows/app | Out-Null
          New-Item -ItemType Directory -Force release/windows/verification | Out-Null
          $exe = Get-ChildItem -Path dist -Filter 'SafeLedger-*-Portable.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE was not created.' }
          $staged = Join-Path 'release/windows/app' $exe.Name
          Copy-Item $exe.FullName -Destination $staged
          npm run docs:pdf -- release/windows/app/README.pdf
          if (-not (Test-Path 'release/windows/app/README.pdf')) { throw 'README.pdf was not generated.' }
          node scripts/generate-release-trust.js $staged release/windows/verification windows x64 "${{ github.sha }}"
          $sbom = Get-ChildItem -Path release/windows/verification -Filter '*-SBOM.cdx.json' | Select-Object -First 1
          if (-not $sbom) { throw 'SBOM was not generated.' }
          "artifact=$staged" >> $env:GITHUB_OUTPUT
          "sbom=$($sbom.FullName)" >> $env:GITHUB_OUTPUT

      - name: Attest Windows build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}

      - name: Attest Windows SBOM
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.artifact }}
          sbom-path: ${{ steps.stage.outputs.sbom }}

      - name: Upload clean portable download
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Windows-Portable
          path: release/windows/app/*
          if-no-files-found: error

      - name: Upload Windows verification files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Windows-Verification
          path: release/windows/verification/*
          if-no-files-found: error
