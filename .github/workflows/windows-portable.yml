name: Build SafeLedger Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        shell: pwsh
        run: npm run test:regression

      - name: Run Electron crypto smoke test
        shell: pwsh
        run: npm run test:electron-crypto

      - name: Launch real SafeLedger GUI smoke test
        shell: pwsh
        run: npm run test:gui-smoke

      - name: Build portable EXE
        shell: pwsh
        run: npm run dist:win

      - name: Stage portable EXE and PDF README
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          $exe = Get-ChildItem -Path dist -Filter 'SafeLedger-*-Portable.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE was not created.' }
          Copy-Item $exe.FullName -Destination release/windows/
          npm run docs:pdf -- release/windows/README.pdf
          if (-not (Test-Path 'release/windows/README.pdf')) { throw 'README.pdf was not generated.' }

      - name: Upload flat portable download
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SafeLedger-Windows-Portable
          path: release/windows/*
          if-no-files-found: error
