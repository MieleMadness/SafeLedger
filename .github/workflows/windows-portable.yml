name: Build SafeLedger Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - modernize-safeledger-2

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build portable EXE
        shell: pwsh
        run: npm run dist:win

      - name: Upload portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: SafeLedger-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
