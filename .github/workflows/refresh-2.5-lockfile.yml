name: Refresh SafeLedger 2.5 Lockfile

on:
  push:
    branches:
      - release-2.5-implementation
    paths:
      - '.github/workflows/refresh-2.5-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: release-2.5-implementation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Regenerate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify normalized root dependency metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('Lockfile version does not match package.json.');
          const rootDeps = lock.packages?.['']?.dependencies || {};
          for (const name of ['bootstrap', 'font-awesome']) {
            if (Object.prototype.hasOwnProperty.call(rootDeps, name)) throw new Error(`Retired dependency remains in lockfile root: ${name}`);
          }
          NODE
      - name: Commit normalized lockfile
        run: |
          git config user.name 'SafeLedger Release Automation'
          git config user.email '84972636+MieleMadness@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already normalized.'
            exit 0
          fi
          git commit -m 'Normalize dependency lock for 2.5'
          git push origin HEAD:release-2.5-implementation
