name: Bug report
description: Report a reproducible SafeLedger defect that is not a private security vulnerability.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real seed phrases, private keys, passwords, PINs, customer vault data, or production signing material. Security vulnerabilities should follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SafeLedger version
      placeholder: 2.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows Portable
        - Linux AppImage
        - Development environment
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real secrets and private customer data from this report.
          required: true
