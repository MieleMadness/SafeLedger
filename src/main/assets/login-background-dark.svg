<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="SafeLedger dark crypto login wallpaper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset=".55" stop-color="#09172b"/>
      <stop offset="1" stop-color="#071224"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1976ff" stop-opacity=".46"/>
      <stop offset=".42" stop-color="#125ecb" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a244f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19345c" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0d203e" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="eth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db8ff"/>
      <stop offset="1" stop-color="#28518f"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1976ff" flood-opacity=".22"/>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="1040" cy="150" rx="315" ry="250" fill="url(#blueGlow)"/>
  <ellipse cx="1035" cy="610" rx="340" ry="235" fill="url(#blueGlow)" opacity=".82"/>
  <ellipse cx="680" cy="690" rx="260" ry="180" fill="url(#blueGlow)" opacity=".38"/>

  <!-- subtle flowing lines from the supplied neon reference -->
  <g fill="none" stroke="#4a8ce8" stroke-opacity=".12" stroke-width="2">
    <path d="M650 720C780 560 850 620 965 470S1160 340 1280 410"/>
    <path d="M690 720C810 575 885 635 990 490S1175 365 1280 430"/>
    <path d="M730 720C845 590 920 650 1020 510S1190 390 1280 452"/>
    <path d="M820 0C930 110 1035 70 1160 175S1235 310 1280 340"/>
  </g>

  <!-- Bitcoin coin -->
  <g transform="translate(1040 125)" filter="url(#shadow)">
    <circle r="88" fill="url(#glass)" stroke="#3788ff" stroke-opacity=".58" stroke-width="2"/>
    <circle r="73" fill="none" stroke="#5aa2ff" stroke-opacity=".38" stroke-width="2"/>
    <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="86" font-weight="700" fill="#77b5ff" stroke="#d5e9ff" stroke-opacity=".18" stroke-width="1">₿</text>
  </g>

  <!-- Ethereum crystal -->
  <g transform="translate(820 220)" filter="url(#softGlow)">
    <polygon points="0,-82 52,8 0,39 -52,8" fill="url(#eth)" stroke="#77b5ff" stroke-opacity=".75"/>
    <polygon points="0,49 52,18 0,91 -52,18" fill="#27538f" stroke="#6aa9ff" stroke-opacity=".7"/>
    <polygon points="0,-82 0,39 -52,8" fill="#3c6ca9" opacity=".82"/>
  </g>

  <!-- Chainlink-like hexagon -->
  <g transform="translate(1150 315)" filter="url(#tinyGlow)">
    <polygon points="0,-64 56,-32 56,32 0,64 -56,32 -56,-32" fill="none" stroke="#4e93ef" stroke-width="18"/>
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#0b1a31"/>
  </g>

  <!-- Solana mark -->
  <g transform="translate(740 425) skewX(-12)" fill="#4d9aff" filter="url(#tinyGlow)">
    <rect x="-55" y="-44" width="112" height="22" rx="6"/>
    <rect x="-45" y="-11" width="112" height="22" rx="6" opacity=".82"/>
    <rect x="-55" y="22" width="112" height="22" rx="6" opacity=".66"/>
  </g>

  <!-- USDC-style coin -->
  <g transform="translate(1105 535)" filter="url(#shadow)">
    <circle r="74" fill="url(#glass)" stroke="#3d89ed" stroke-opacity=".6" stroke-width="2"/>
    <path d="M-43-46C-70-18-70 18-43 46M43-46C70-18 70 18 43 46" fill="none" stroke="#589cf2" stroke-width="10" stroke-linecap="round"/>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#75b6ff">$</text>
  </g>

  <!-- wallet -->
  <g transform="translate(720 610)" filter="url(#shadow)">
    <rect x="-95" y="-57" width="190" height="114" rx="22" fill="url(#glass)" stroke="#397ed1" stroke-width="2"/>
    <path d="M-78-43H58C76-43 88-32 88-15" fill="none" stroke="#396da9" stroke-width="8" stroke-linecap="round"/>
    <rect x="27" y="-11" width="82" height="46" rx="16" fill="#122b4e" stroke="#4389dc" stroke-width="2"/>
    <circle cx="54" cy="12" r="7" fill="#63a6f7"/>
  </g>

  <!-- lock -->
  <g transform="translate(935 650)" filter="url(#softGlow)">
    <path d="M-38-15V-42C-38-80 38-80 38-42V-15" fill="none" stroke="#4f95eb" stroke-width="18" stroke-linecap="round"/>
    <rect x="-62" y="-18" width="124" height="92" rx="20" fill="url(#glass)" stroke="#4d92e6" stroke-width="2"/>
    <circle cy="20" r="10" fill="#63a6f7"/>
    <path d="M0 28V46" stroke="#63a6f7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- small glowing cubes/spheres -->
  <g fill="#17345d" fill-opacity=".72" stroke="#4a8ce8" stroke-opacity=".48" filter="url(#tinyGlow)">
    <circle cx="1220" cy="205" r="28"/>
    <circle cx="870" cy="675" r="34"/>
    <circle cx="1220" cy="670" r="42"/>
    <rect x="900" y="95" width="42" height="42" rx="9" transform="rotate(18 921 116)"/>
  </g>
</svg>
